name: "marketing_orchestration"
version: "1.0.0"
config-version: 2
profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_packages"

flags:
    static_analysis: false

vars:
    source_database: "{{ env_var('DBT_PROFILE_PROJECT', target.project) }}"
    ga4_database: "{{ env_var('DBT_GA4_PROJECT', 'sigma-sector-488608-g0') }}"
    ga4_schema: "analytics_526441677"
    supabase_schema: "crm_raw"
    hubspot_schema: "crm_raw"
    meta_ads_schema: "analytics_raw"
    linkedin_ads_schema: "analytics_raw"
    salesforce_schema: "crm_raw"

models:
    marketing_orchestration:
        +persist_docs:
            relation: true
            columns: true
        base:
            +schema: analytics_staging
        staging:
            +schema: analytics_staging
            +materialized: view
        dimensions:
            +schema: analytics_core
        facts:
            +schema: analytics_core
        marts:
            +schema: analytics_mart
            +materialized: table
            fct_survey_conversions:
                +schema: analytics_core
        ml:
            +schema: analytics_mart
