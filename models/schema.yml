version: 2

sources:
  - name: ga4
    database: "{{ var('ga4_database', 'sigma-sector-488608-g0') }}"
    schema: "{{ var('ga4_schema', 'analytics_526441677') }}"
    loader: gcp_console
    tables:
      - name: events
        identifier: "events_*"
        description: "Historical sharded GA4 events."
      - name: events_intraday
        identifier: "events_intraday_*"
        description: "Real-time intraday sharded GA4 events."

  - name: supabase_raw
    description: "Transactional data synced from Supabase (Postgres)."
    database: "{{ var('source_database', env_var('DBT_PROFILE_PROJECT', target.project)) }}"
    schema: "{{ var('supabase_schema', 'crm_raw') }}"
    tables:
      - name: leads
        description: "Privacy-safe lead records synced from Supabase into BigQuery raw storage."
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 18, period: hour}
            error_after: {count: 36, period: hour}
        columns:
          - name: record_id
            description: "Supabase lead row identifier used as the raw-table merge key."
            tests:
              - not_null
              - unique
          - name: submission_id
            description: "Linked survey submission identifier from Supabase."
          - name: hashed_email
            description: "Privacy-safe SHA-256 email hash propagated from the application boundary."
            tests:
              - not_null
          - name: company
            description: "Company attribute captured from the survey lead form when provided."
          - name: contact_consent
            description: "Boolean consent flag preserved from Supabase lead capture."
          - name: lead_status
            description: "Lead pipeline status persisted in Supabase."
          - name: created_at
            description: "Original record creation timestamp in Supabase."
          - name: updated_at
            description: "Latest record update timestamp in Supabase."
          - name: ingested_at
            description: "Warehouse ingestion timestamp emitted by the worker and used for freshness checks."
            tests:
              - not_null
      - name: survey_submissions
        description: "Survey submission records synced from Supabase into BigQuery raw storage."
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 18, period: hour}
            error_after: {count: 36, period: hour}
        columns:
          - name: record_id
            description: "Supabase submission row identifier used as the raw-table merge key."
            tests:
              - not_null
              - unique
          - name: event_id
            description: "Application event UUID captured at the survey submission boundary."
            tests:
              - not_null
          - name: user_pseudo_id
            description: "GA4 anonymous user identifier preserved from the survey submission payload."
          - name: session_id
            description: "Application/GA4 session identifier captured with the submission."
          - name: hashed_email
            description: "Privacy-safe SHA-256 email hash for identity stitching across analytics and CRM systems."
          - name: readiness_level
            description: "Survey readiness label persisted in Supabase."
          - name: readiness_score
            description: "Numeric survey readiness score persisted in Supabase."
          - name: score_range
            description: "Canonical readiness bucket stored with the submission."
          - name: total_questions
            description: "Question count used when computing the readiness score."
          - name: created_at
            description: "Original record creation timestamp in Supabase."
          - name: updated_at
            description: "Latest record update timestamp in Supabase."
          - name: ingested_at
            description: "Warehouse ingestion timestamp emitted by the worker and used for freshness checks."
            tests:
              - not_null

  - name: supabase
    database: "{{ var('source_database', env_var('DBT_PROFILE_PROJECT', target.project)) }}"
    schema: "{{ var('supabase_schema', 'crm_raw') }}"
    tables:
      - name: survey_submissions
        description: "Survey data synced from Supabase"
      - name: leads
        description: "Leads synced from Supabase"

  - name: hubspot
    database: "{{ var('source_database', env_var('DBT_PROFILE_PROJECT', target.project)) }}"
    schema: "{{ var('hubspot_schema', 'crm_raw') }}"
    tables:
      - name: contacts
        description: "Synced contacts from HubSpot"
      - name: companies
        description: "Synced companies from HubSpot"
      - name: deals
        description: "Synced deals from HubSpot"

  - name: meta_ads
    database: "{{ var('source_database', env_var('DBT_PROFILE_PROJECT', target.project)) }}"
    schema: "{{ var('meta_ads_schema', 'analytics_raw') }}"
    tables:
      - name: ads_performance
        identifier: "meta_ads_campaigns"
        description: "Raw performance data from Meta Ads"

  - name: linkedin_ads
    database: "{{ var('source_database', env_var('DBT_PROFILE_PROJECT', target.project)) }}"
    schema: "{{ var('linkedin_ads_schema', 'analytics_raw') }}"
    tables:
      - name: campaign_performance
        identifier: "linkedin_ads_campaigns"
        description: "Raw performance data from LinkedIn Ads"

  - name: salesforce
    database: "{{ var('source_database', env_var('DBT_PROFILE_PROJECT', target.project)) }}"
    schema: "{{ var('salesforce_schema', 'crm_raw') }}"
    tables:
      - name: leads
        description: "Raw Lead objects from Salesforce"
      - name: opportunities
        description: "Raw Opportunity objects from Salesforce"

models:
  - name: stg_ga4_events
    description: "Flattened and cleaned GA4 event stream with privacy-safe identity fields extracted from GA4 top-level and event-param payloads."
    columns:
      - name: dbt_event_id
        description: "Deterministic surrogate key for de-duplicated GA4 events."
        tests:
          - unique
          - not_null
      - name: app_event_id
        description: "Application-level UUID captured in GA4 event params for cross-system joins."
      - name: event_timestamp
        description: "Event timestamp normalized to TIMESTAMP from GA4 micros precision."
      - name: event_date
        description: "Event date used for daily slicing and partition-friendly filtering."
      - name: user_pseudo_id
        description: "GA4 anonymous persistent user identifier for behavioral tracking."
        tests:
          - not_null
      - name: hashed_user_id
        description: "Privacy-safe hashed identity extracted from GA4 event params (`hashed_email`, `user_id`) or top-level GA4 `user_id` without re-hashing."
      - name: event_name
        description: "Canonical GA4 event name."
      - name: ga_session_id
        description: "Extracted Google Analytics session identifier."
      - name: page_location
        description: "Cleaned page URL path."
      - name: page_title
        description: "Page title captured at event time."
      - name: page_referrer
        description: "Referrer URL captured for attribution context."
      - name: utm_source
        description: "UTM source parameter extracted from GA4 event params."
      - name: utm_medium
        description: "UTM medium parameter extracted from GA4 event params."
      - name: utm_campaign
        description: "UTM campaign parameter extracted from GA4 event params."
      - name: event_version
        description: "Schema version validation string ('v1', 'v2')."
        tests:
          - not_null
      - name: device_platform
        description: "Source platform/device context from GA4 (for example WEB, ANDROID, IOS)."

  - name: stg_survey_submissions
    description: "Staged survey submissions at one row per submission, preferring Supabase raw records and falling back to GA4 app events when warehouse sync is not yet available."
    columns:
      - name: submission_id
        description: "Unique survey submission identifier used as submission grain key."
        tests:
          - not_null
      - name: app_event_id
        description: "Application event UUID linking survey submission to GA4 events."
      - name: user_pseudo_id
        description: "Anonymous GA4 user identifier at submission time."
      - name: ga_session_id
        description: "GA4 session id associated with the submission event."
      - name: readiness_level
        description: "Survey readiness category label when available from source."
      - name: overall_score
        description: "Numeric readiness score for the submission when available."
      - name: score_range
        description: "Bucketed score range representation used for reporting."
      - name: created_at
        description: "Submission creation timestamp used as conversion time anchor."

  - name: stg_leads
    description: "Staged lead identities mapped to submissions with privacy-safe hashed identifiers, preferring Supabase raw leads and falling back to HubSpot and GA4 identity signals."
    columns:
      - name: internal_lead_id
        description: "Deterministic internal lead key generated from submission and hashed identity values."
        tests:
          - not_null
      - name: submission_id
        description: "Submission id used to link lead identity to survey conversion records."
      - name: hashed_email
        description: "SHA-256 hashed email used as primary privacy-safe identity join key."
      - name: company
        description: "Company name attribute when available from lead source."
      - name: source_platform
        description: "Source system used to build this staged lead row."
      - name: created_at
        description: "Lead record creation timestamp in the staging model."

  - name: stg_linkedin_leads
    description: "Staged LinkedIn campaign performance records from the analytics dataset."
    columns:
      - name: event_date
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null
      - name: source_platform
        tests:
          - not_null

  - name: stg_hubspot_contacts
    description: "Staged HubSpot contacts with privacy-safe hashed identity fields and normalized profile attributes."
    columns:
      - name: crm_id
        tests:
          - not_null
      - name: hashed_email
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_hubspot_companies
    description: "Staged HubSpot companies normalized for account-level attribution and joins."
    columns:
      - name: crm_id
        tests:
          - not_null
      - name: company_name
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_hubspot_deals
    description: "Staged HubSpot deals normalized for opportunity and pipeline analysis."
    columns:
      - name: crm_id
        tests:
          - not_null
      - name: pipeline
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: dim_identity_map
    description: "The primary identity resolution table linking GA4 pseudo-IDs to hashed emails via app_event_id bridges and direct hashed-identity matches."
    columns:
      - name: identity_key
        description: "Deterministic identity surrogate key derived from hashed email."
        tests:
          - unique
          - not_null
      - name: hashed_email
        description: "Privacy-safe hashed email used as canonical identity key across systems."
        tests:
          - unique
          - not_null
      - name: user_pseudo_id
        description: "Mapped GA4 anonymous user identifier for the stitched identity."
      - name: internal_lead_id
        description: "Mapped internal lead key from staged lead identity records."
      - name: identified_at
        description: "Earliest timestamp when identity linkage was established."

  - name: fct_survey_conversions
    description: "Granular fact table linking every survey submission to its acquiring marketing source."
    columns:
      - name: submission_id
        description: "Primary key at one row per survey conversion submission."
        tests:
          - unique
          - not_null
      - name: app_event_id
        description: "Application UUID used to bridge conversion to GA4 session context."
      - name: user_pseudo_id
        description: "Anonymous GA4 user identifier associated with the conversion."
        tests:
          - not_null
      - name: ga_session_id
        description: "GA4 session id captured for the conversion event."
      - name: readiness_level
        description: "Survey readiness category at conversion time."
      - name: overall_score
        description: "Survey readiness score used for quality and segmentation metrics."
      - name: score_range
        description: "Bucketed score band for reporting and semantic grouping."
      - name: utm_source
        description: "Attributed marketing source for the conversion."
      - name: utm_medium
        description: "Attributed marketing medium for the conversion."
      - name: utm_campaign
        description: "Attributed marketing campaign for the conversion."
      - name: conversion_timestamp
        description: "Timestamp when the conversion submission occurred."
      - name: is_high_quality_lead
        description: "Binary lead-quality flag where 1 indicates score threshold met."

  - name: mart_lead_attribution
    description: "Performance-optimized dashboard view of lead acquisition by UTM source and campaign."
    columns:
      - name: conversion_date
        description: "Daily conversion date used for trend analysis and partition pruning."
        tests:
          - not_null
      - name: utm_source
        description: "Marketing source dimension used for attribution breakdowns."
        tests:
          - not_null
      - name: utm_medium
        description: "Marketing medium dimension used for channel-level reporting."
      - name: utm_campaign
        description: "Marketing campaign dimension used for campaign performance views."
      - name: total_conversions
        description: "Total number of survey conversions for the grouped dimensions."
      - name: total_high_quality_leads
        description: "Count of conversions flagged as high-quality leads."
      - name: average_readiness_score
        description: "Average readiness score across grouped conversion records."

  - name: mart_funnel_efficiency
    description: "Acquisition funnel metrics tracking conversion rates from Session to Lead."

  - name: mart_readiness_distribution
    description: "Distribution of survey results by readiness bucket."
    columns:
      - name: conversion_date
        description: "Date of the survey conversion used to group readiness distribution."
        tests:
          - not_null
      - name: score_bucket
        description: "Canonical readiness bucket derived from survey scores."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - '20-35_data_disadvantaged'
                  - '36-50_data_aware'
                  - '51-70_data_capable'
                  - '71-85_data_advantaged'
                  - '86-100_data_leadership'
      - name: submission_count
        description: "Number of submissions in the readiness bucket for the date."
        tests:
          - not_null

  - name: mart_survey_funnel
    description: "Daily dashboard-ready survey funnel by channel, from started to converted and high-quality lead outcomes."
    columns:
      - name: event_date
        description: "Event date grain used for all funnel metrics."
        tests:
          - not_null
      - name: utm_source
        description: "Attributed source dimension normalized for direct and missing values."
        tests:
          - not_null
      - name: utm_medium
        description: "Attributed medium dimension normalized for none and missing values."
        tests:
          - not_null
      - name: utm_campaign
        description: "Attributed campaign dimension normalized for not_set and missing values."
        tests:
          - not_null
      - name: started_sessions
        description: "Distinct GA4 sessions that emitted survey_started events."
      - name: started_submissions
        description: "Distinct app_event_id count for survey_started events."
      - name: form_submitted_submissions
        description: "Distinct app_event_id count for survey_form_submitted events."
      - name: completed_submissions
        description: "Distinct app_event_id count for survey_completed events."
      - name: converted_submissions
        description: "Distinct submission_id count from fct_survey_conversions."
      - name: high_quality_converted_submissions
        description: "Count of converted submissions flagged as high-quality leads."
      - name: started_to_form_submit_rate
        description: "Rate from started submissions to form submitted submissions."
      - name: started_to_completed_rate
        description: "Rate from started submissions to completed submissions."
      - name: completed_to_converted_rate
        description: "Rate from completed submissions to converted submissions."
      - name: converted_to_hq_rate
        description: "Rate from converted submissions to high-quality converted submissions."

  - name: mart_semantic_overview
    description: "Unified Looker-ready semantic mart. Grain: one row per event_date × utm_source × utm_medium × utm_campaign. Combines full funnel steps, conversion outcomes, avg readiness score, and pivoted readiness bucket counts. Use this as the primary BigQuery data source in Looker Studio."
    columns:
      - name: event_date
        description: "Partition date. All funnel and conversion metrics are attributed to this date."
        tests:
          - not_null
      - name: utm_source
        description: "Normalized UTM source. Blanks replaced with (direct)."
        tests:
          - not_null
      - name: utm_medium
        description: "Normalized UTM medium. Blanks replaced with (none)."
        tests:
          - not_null
      - name: utm_campaign
        description: "Normalized UTM campaign. Blanks replaced with (not_set)."
        tests:
          - not_null
      - name: started_sessions
        description: "Distinct GA4 sessions that fired survey_started."
      - name: started_count
        description: "Distinct survey_started app_event_id count (one per survey attempt)."
      - name: form_submitted_count
        description: "Distinct survey_form_submitted app_event_id count."
      - name: completed_count
        description: "Distinct survey_completed app_event_id count."
      - name: converted_count
        description: "Distinct submission_id rows in fct_survey_conversions attributed to this channel."
      - name: hq_converted_count
        description: "Converted submissions flagged as high-quality leads (is_high_quality_lead=1)."
      - name: avg_readiness_score
        description: "Average overall_score across converted submissions for this channel/date."
      - name: bucket_data_disadvantaged
        description: "Count of converted submissions in the 20-35_data_disadvantaged readiness bucket."
      - name: bucket_data_aware
        description: "Count of converted submissions in the 36-50_data_aware readiness bucket."
      - name: bucket_data_capable
        description: "Count of converted submissions in the 51-70_data_capable readiness bucket."
      - name: bucket_data_advantaged
        description: "Count of converted submissions in the 71-85_data_advantaged readiness bucket."
      - name: bucket_data_leadership
        description: "Count of converted submissions in the 86-100_data_leadership readiness bucket."
      - name: form_submit_rate_pct
        description: "Percentage of started surveys that reached form_submitted step."
      - name: completion_rate_pct
        description: "Percentage of started surveys that reached survey_completed step."
      - name: conversion_rate_pct
        description: "Percentage of started surveys that resulted in a CRM-recorded conversion."
      - name: hq_rate_pct
        description: "Percentage of converted submissions that qualified as high-quality leads."
